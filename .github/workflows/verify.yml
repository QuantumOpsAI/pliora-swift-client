name: Verify generated Swift client

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable provenance
        run: |
          python3 scripts/verify_provenance.py
          python3 -m unittest discover -s tests
      - name: Build package
        run: swift build
